services:
  postgres:
    image: postgres:16-alpine
    container_name: kidseedshub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kidseedshub
      POSTGRES_PASSWORD: kidseedshub
      POSTGRES_DB: kidseedshub
    ports:
      - "5434:5432"
    volumes:
      - kidseedshub-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kidseedshub -d kidseedshub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kidseedshub-postgres-data:
