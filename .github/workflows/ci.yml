name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - staging

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_SECRET: ci-auth-secret
      CLASS_PHOTO_UPLOAD_DRIVER: local
      DATABASE_URL: postgresql://kidseedshub:kidseedshub@localhost:5432/kidseedshub
      DIRECT_URL: postgresql://kidseedshub:kidseedshub@localhost:5432/kidseedshub
      KIDSEEDSHUB_ENVIRONMENT: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repo bloat audit
        run: npm run repo:audit

      - name: TypeScript
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Automated tests
        run: npm run test

      - name: Prisma schema validation
        run: npx prisma validate

      - name: Production build
        run: npm run build
